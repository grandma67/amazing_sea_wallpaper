# Builds the site and publishes it to GitHub Pages. Visitors' browsers render
# the wallpaper themselves; this job also renders today's (UTC) wallpaper in
# headless Chromium so wallpaper tools can fetch a plain /latest.jpg.
#
# Runners have no GPU, so the snapshot uses SwiftShader (software WebGL) and
# fewer cloud frames; it can take tens of minutes. If it fails, the site is
# still deployed without a fresh latest.jpg.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '5 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run build

      - name: Render today's wallpaper
        id: render
        continue-on-error: true
        timeout-minutes: 120
        # Each render's debug numbers (exposure, scene luminance, frame meter) in the log;
        # a NaN prints as "NaN" (tools/RENDER.md "Blank frames").
        env:
          DEBUG: '1'
        run: |
          npx playwright install --with-deps chromium
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ > /dev/null && break; sleep 1; done
          TODAY=$(date -u +%F)
          # Two wallpapers: PC (1920×1080, 16:9) and phone (1290×2796, 19.5:9:
          # the largest iPhones' native size, so every phone gets the same or a
          # downscaled image; 20:9 Androids crop ~3% of the width). Phone first,
          # as the app falls back to it. snapshot.mjs gives up after --budget
          # seconds (default 900, too short for SwiftShader); both fit the
          # step's 120 min. --fail-blank: a blank frame (2026-11-15 published a black
          # one) isn't saved and fails the step; so does a render whose WebGL context was
          # lost. Both render outside dist/ and are copied in only when both pass, so a
          # failure publishes neither (2026-11-15's run published a half-black phone
          # image before the PC render failed) and the desktop scripts keep yesterday's.
          OUT="$RUNNER_TEMP/daily"
          node scripts/snapshot.mjs --url http://localhost:4173/ --out "$OUT/phone" \
            --w 1290 --h 2796 --frames 24 --quality 0.92 --fail-blank --budget 3600 "$TODAY"
          node scripts/snapshot.mjs --url http://localhost:4173/ --out "$OUT/pc" \
            --w 1920 --h 1080 --frames 24 --quality 0.92 --fail-blank --budget 3000 "$TODAY"
          mkdir -p dist/daily/phone dist/daily/pc
          cp "$OUT/phone/$TODAY.jpg" "$OUT/phone/$TODAY.json" dist/daily/phone/
          cp "$OUT/pc/$TODAY.jpg" "$OUT/pc/$TODAY.json" dist/daily/pc/
          cp "$OUT/phone/$TODAY.jpg" dist/latest-portrait.jpg
          cp "$OUT/phone/$TODAY.json" dist/latest-portrait.json
          cp "$OUT/pc/$TODAY.jpg" dist/latest.jpg
          cp "$OUT/pc/$TODAY.json" dist/latest.json

      # A failed render: its frames (a blank one as NAME.blank.jpg/.json) for a look,
      # downloadable from the run's page. Not published.
      - uses: actions/upload-artifact@v5
        if: steps.render.outcome == 'failure'
        with:
          name: failed-render
          path: ${{ runner.temp }}/daily
          if-no-files-found: warn

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
