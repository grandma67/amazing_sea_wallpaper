# Renders a day on the runner exactly as pages.yml does (vite preview, SwiftShader, 24
# frames, phone and PC), once with Chromium's GPU watchdog on and once off, and uploads
# the images. Made for the 2026-11-15 black frames (tools/RENDER.md "Blank frames"): the
# Mac renders that day fine, so only the runner shows whether the watchdog is the cause.
# Deploys nothing. Run it by pushing to the render-check branch or from the Actions tab.

name: Render check

on:
  push:
    branches: [render-check]
  workflow_dispatch:
    inputs:
      date:
        description: Day to render (YYYY-MM-DD)
        default: '2026-11-15'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        watchdog: [on, off]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Render (GPU watchdog ${{ matrix.watchdog }})
        env:
          DAY: ${{ inputs.date || '2026-11-15' }}
        run: |
          npx playwright install --with-deps chromium
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ > /dev/null && break; sleep 1; done
          status=0
          node scripts/snapshot.mjs --url http://localhost:4173/ --out out/phone --gpu-watchdog ${{ matrix.watchdog }} \
            --w 1290 --h 2796 --frames 24 --quality 0.92 --fail-blank --budget 3600 "$DAY" || status=1
          node scripts/snapshot.mjs --url http://localhost:4173/ --out out/pc --gpu-watchdog ${{ matrix.watchdog }} \
            --w 1920 --h 1080 --frames 24 --quality 0.92 --fail-blank --budget 3000 "$DAY" || status=1
          exit $status

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: render-watchdog-${{ matrix.watchdog }}
          path: out
          if-no-files-found: warn
