<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Amazing Sea Wallpaper</title>
    <meta name="description" content="A new photorealistic sea and beach wallpaper every day, rendered in your browser from the date." />
    <meta name="theme-color" content="#0b1e3a" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="wallpaper"></canvas>
    <div id="splash" role="status" aria-live="polite">
      <div class="splash-sun"></div>
      <p id="status">Painting today's sea…</p>
      <div class="splash-sea">
        <svg class="wave back" viewBox="0 0 2880 120" preserveAspectRatio="none" aria-hidden="true">
          <path d="M0 60 Q180 20 360 60 T720 60 T1080 60 T1440 60 T1800 60 T2160 60 T2520 60 T2880 60 V120 H0 Z" />
        </svg>
        <svg class="wave middle" viewBox="0 0 2880 120" preserveAspectRatio="none" aria-hidden="true">
          <path d="M0 60 Q180 20 360 60 T720 60 T1080 60 T1440 60 T1800 60 T2160 60 T2520 60 T2880 60 V120 H0 Z" />
        </svg>
        <svg class="boat" viewBox="0 0 64 56" aria-hidden="true">
          <path class="sail" d="M33 4 L33 38 L52 38 Z" />
          <path class="sail small" d="M30 12 L30 38 L16 38 Z" />
          <path class="hull" d="M8 40 H58 L50 52 H16 Z" />
        </svg>
        <svg class="wave front" viewBox="0 0 2880 120" preserveAspectRatio="none" aria-hidden="true">
          <path d="M0 60 Q180 20 360 60 T720 60 T1080 60 T1440 60 T1800 60 T2160 60 T2520 60 T2880 60 V120 H0 Z" />
        </svg>
      </div>
    </div>
    <footer id="info" hidden>
      <div>
        <h1 id="title"></h1>
        <p id="date"></p>
      </div>
      <nav>
        <a id="prev" title="Previous day">←</a>
        <a id="today" title="Today">Today</a>
        <a id="next" title="Next day">→</a>
        <a id="random" href="./random/" title="A random day">Random</a>
        <button id="download">Download</button>
      </nav>
    </footer>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
